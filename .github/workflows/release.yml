name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  binary:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build (arm64 + amd64)
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ needs.release-please.outputs.tag_name }}" \
            -o dist/frameio-icloud-darwin-arm64 ./cmd/frameio-icloud
          GOOS=darwin GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ needs.release-please.outputs.tag_name }}" \
            -o dist/frameio-icloud-darwin-amd64 ./cmd/frameio-icloud
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/frameio-icloud-darwin-arm64 \
            dist/frameio-icloud-darwin-amd64
